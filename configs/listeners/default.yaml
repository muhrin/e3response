defaults:
  - model_checkpoint
  - early_stopping
  #  - model_summary
  - rich_progress_bar
  # - tensor_parity_plots
  - _self_


model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/loss"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: "val/nmr_tensors_rmse"
  patience: 20
  check_on_train_epoch_end: True

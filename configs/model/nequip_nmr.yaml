_target_: tensorial.ReaxModule

metrics:
  nmr_tensors_rmse:
    _target_: tensorial.mlip.graph_metric
    metric: rmse
    predictions: nodes.NMR_tensors_predicted
    targets: nodes.NMR_tensors
    mask: nodes.nmr_active

# mul: 8
# node_feature_irreps: ${mul}x0o + ${mul}x0e + ${mul}x1o + ${mul}x1e + ${mul}x2o + ${mul}x2e + ${mul}x3o + ${mul}x3e
# node_feature_irreps: 8x0o + 8x0e + 8x1o + 8x1e + 8x2o + 8x2e + 8x3o + 8x3e
# NMR_irreps: 1x0e + 1x1e + 1x2e

optimizer:
  _target_: optax.nadamw
  learning_rate: 0.01
  # learning_rate:
  #     _target_: optax.exponential_decay
  #     init_value: 0.05
  #     transition_steps: 500
  #     decay_rate: 0.9

loss_fn:
  _target_: tensorial.mlip.Loss
  field: nodes.NMR_tensors_predicted
  target_field: nodes.NMR_tensors
  mask_field: nodes.nmr_active



model:
  _target_: tensorial.nn.Sequential
  layers:
    - _target_: tensorial.mlip.atomic.SpeciesTransform
      atomic_numbers: ${from_data.atomic_numbers}

    - _target_: tensorial.mlip.NodewiseEncoding
      attrs:
        species:
          _target_: tensorial.tensors.OneHot
          num_classes: ${from_data.n_elements}

    - _target_: tensorial.mlip.EdgeVectors

    - _target_: tensorial.mlip.EdgewiseEncoding
      attrs:
        edge_vectors:
          _target_: tensorial.tensors.SphericalHarmonic
          irreps: 0e + 1o
          normalise: True

    - _target_: tensorial.mlip.RadialBasisEdgeEncoding
      r_max: ${r_max}

    - _target_: tensorial.mlip.NodewiseLinear
      field: attributes
      irreps_out: 8x0o + 8x0e + 8x1o + 8x1e + 8x2o + 8x2e #+ 8x3o + 8x3e

    - _target_: tensorial.mlip.NequipLayer
      irreps_out: 8x0o + 8x0e + 8x1o + 8x1e + 8x2o + 8x2e #+ 8x3o + 8x3e
      avg_num_neighbours: ${from_data.avg_num_neighbours}

    - _target_: tensorial.mlip.NequipLayer
      irreps_out: 8x0o + 8x0e + 8x1o + 8x1e + 8x2o + 8x2e #+ 8x3o + 8x3e
      avg_num_neighbours: ${from_data.avg_num_neighbours}

    - _target_: tensorial.mlip.NequipLayer
      irreps_out: 8x0o + 8x0e + 8x1o + 8x1e + 8x2o + 8x2e #+ 8x3o + 8x3e
      avg_num_neighbours: ${from_data.avg_num_neighbours}

    # Keep only scalars and reduce the number passing this point
    - _target_: tensorial.mlip.NodewiseLinear
      irreps_out: 4x0e + 4x0o + 4x1e + 4x1o + 4x2e + 4x2o + 2x3o + 2x3e

    # Per atom Raman tensors
    - _target_: tensorial.mlip.NodewiseLinear
      irreps_out: 1x0e + 1x1e + 1x2e
      out_field: NMR_tensors_predicted

    - _target_: tensorial.mlip.NodewiseDecoding
      in_field: NMR_tensors_predicted
      attrs:
        NMR_tensors_predicted:
          _target_: tensorial.CartesianTensor
          formula: ij
          i: 1o
          j: 1o

# @package _global_

#from_data:
#  energy_shifts:
#    _target_: tensorial.gcnn.atomic.EnergyContributionLstsq
#    type_map: ${from_data.atomic_numbers}

model:
  _target_: tensorial.ReaxModule

  optimizer:
    _partial_: True
    _target_: optax.adam
    learning_rate: 0.01

  #scheduler:
  #  _target_: optax.schedules.cosine_decay_schedule
  #  init_value: 0.1
  #  decay_steps: 400

  metrics:
    BEC:
      _target_: tensorial.gcnn.graph_metric
      metric: rmse
      predictions: nodes.predicted_born_charges
      targets: nodes.born_charges
    raman:
      _target_: tensorial.gcnn.graph_metric
      metric: rmse
      predictions: nodes.predicted_raman_tensors
      targets: nodes.raman_tensors

  loss_fn:
    _target_: tensorial.gcnn.WeightedLoss
    weights: [ 100., 1. ]
    loss_fns:
      - _target_: tensorial.gcnn.Loss
        loss_fn: squared_error
        predictions: nodes.predicted_born_charges
        targets: nodes.born_charges

      - _target_: tensorial.gcnn.Loss
        loss_fn: squared_error
        predictions: nodes.predicted_raman_tensors
        targets: nodes.raman_tensors

  model:
    _target_: tensorial.nn.Sequential
    layers:
      - energy_fn:
          _target_: tensorial.nn.Sequential
          layers:
            - _target_: tensorial.gcnn.atomic.SpeciesTransform
              atomic_numbers: ${from_data.atomic_numbers}

            - _target_: tensorial.gcnn.NodewiseEmbedding
              attrs:
                species:
                  _target_: tensorial.tensors.OneHot
                  num_classes: ${from_data.n_elements}

            - _target_: tensorial.gcnn.Pack
              out_field: globals.attributes
              attrs:
                globals.external_electric_field:
                  _target_: tensorial.tensors.SphericalHarmonic
                  irreps: 0e + 1o
                  normalise: False

            - _target_: tensorial.gcnn.EdgeVectors

            - _target_: tensorial.gcnn.EdgewiseEncoding
              attrs:
                edge_vectors:
                  _target_: tensorial.tensors.SphericalHarmonic
                  irreps: 0e + 1o
                  normalise: True

            - _target_: tensorial.gcnn.RadialBasisEdgeEncoding
              r_max: ${r_max}
              envelope: True

            - _target_: tensorial.gcnn.NodewiseLinear
              field: attributes
              irreps_out: 16x0o + 16x0e + 16x1o + 16x1e

            - _target_: tensorial.gcnn.mace.Mace
              irreps_out: 16x0o + 16x0e + 16x1o + 16x1e + 16x2e # + 16x3o + 16x3e
              out_field: features
              interaction_irreps: o3_restricted
              hidden_irreps: 16x0e + 8x0o + 16x1o + 8x1e + 8x2e
              num_types: ${from_data.n_elements}
              avg_num_neighbours: ${from_data.avg_num_neighbours}
              global_interaction: True
              correlation_order: 2
              global_correlation_order: 2

            # Keep only scalars and reduce the number passing this point
            - _target_: tensorial.gcnn.NodewiseLinear
              irreps_out: 4x0e + 4x0o + 4x1e + 4x1o + 4x2e + 4x2o

            - _target_: tensorial.gcnn.NodewiseLinear
              irreps_out: 1x0e
              out_field: predicted_energy # Per-atom energy

            # Final total energy
            - _target_: tensorial.gcnn.NodewiseReduce
              field: predicted_energy
              out_field: predicted_energy  # Total energy
              as_array: True               # Convert IrrepsArray to array

#      # Polarization
#      -  _target_: e3response.electric.Polarization
#         _partial_: True
#
#      # Dielectric tensor
#      - _target_: e3response.electric.DielectricTensor
#        _partial_: True

      # Born effective charges
      - _target_: e3response.electric.BornCharges
        _partial_: True

      # Raman tensors
      - _target_: e3response.electric.RamanTensors
        _partial_: True
